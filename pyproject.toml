[project]
name = "poetry-tests"
version = "0.1.0"
description = ""
authors = [
    { name = "Iliya Manaenkov", email = "jade_rabbit_86ru@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest (>=7.0.0)",
    "pytest-cov (>=4.0.0)",
    "isort (>=9.0.0,<=10.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<=8.0.0)",
    "mypy (>=1.19.1,<=2.0.0)",
    "black (>=26.1.0,<=27.0.0)",
    "isort (>=9.0.0,<=10.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
(
    venv
  | \.venv
  | env
  | build
  | dist
  /(
      \.git
  )/

)
'''

[tool.isort]
# максимальная длина строки
line_length = 119
# форматировать один импорт
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
[tool.poetry.group.lint.dependencies]
isort = "^9.0.1"